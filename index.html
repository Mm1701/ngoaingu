<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Learning</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body>
<div id="authView" class="auth hidden"><form id="authForm" class="card"><h1>📚 Language Learning</h1>
<input id="email" type="email" placeholder="Email" required><input id="pass" type="password" placeholder="Mật khẩu (≥6 ký tự)" minlength="6">
<button class="btn pri" id="loginBtn" type="submit">Đăng nhập</button><button class="btn" id="regBtn" type="button">Đăng ký</button><button class="btn" id="forgotBtn" type="button">Quên mật khẩu</button><div id="authErr" class="err"></div></form></div>
<div id="appView" class="app hidden"><nav><b>📚 Learning</b>
<button data-p="home" class="on">🏠 Home</button><button data-p="study">📚 Học</button><button data-p="vocab">🗂 Từ vựng</button><button data-p="quiz">🎯 Quiz</button><button data-p="wrong">❌ Câu sai</button><button data-p="stats">📊 Thống kê</button><button data-p="history">🕘 Lịch sử</button><button data-p="data">📥 Dữ liệu</button><button id="logout">↪ Thoát</button></nav>
<main id="main"></main></div><div id="toast" class="toast hidden"></div>
<script src="js/config.js"></script><script src="js/app.js"></script></body></html>
